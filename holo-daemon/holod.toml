# User and group information
user = "holo"
group = "holo"

# Path to the non-volatile memory storage for configuration transactions,
# graceful-restart information, authentication sequence numbers, and more.
#
# Needs to be writable by @user or @group.
database_path = "/var/opt/holo/holo.db"

# Logging configuration
[logging]
  # Logging to journald
  [logging.journald]
    # Enable or disable
    enabled = false

  # Logging to a file
  [logging.file]
    # Enable or disable
    enabled = true
    # File path (needs to be writable by @user or @group)
    dir = "/var/log/"
    # File name
    name = "holod.log"
    # Log rotation (options: "never", "daily", "hourly")
    rotation = "never"
    # Logging style (options: "full", "compact", "pretty", "json")
    style = "full"
    # Enable or disable ANSI terminal colors
    colors = false
    # Sets whether or not the thread ID of the current thread is displayed
    show_thread_id = false
    # Sets whether or not an event’s source code file path and line number are displayed
    show_source = false

  # Logging to the standard output
  [logging.stdout]
    # Enable or disable
    enabled = false
    # Logging style (options: "full", "compact", "pretty", "json")
    style = "full"
    # Enable or disable ANSI terminal colors
    colors = false
    # Sets whether or not the thread ID of the current thread is displayed
    show_thread_id = false
    # Sets whether or not an event’s source code file path and line number are displayed
    show_source = false

# Event recorder (useful for bug reporting)
[event_recorder]
  # Enable or disable the event recorder
  enabled = false
  # Directory where to save the files (needs to be writable by @user or @group)
  dir = "/var/opt/holo"

# Global routing / kernel FIB behaviour (holo-routing).
[routing]
  # Install and uninstall IP/MPLS routes in the kernel FIB via netlink.
  # Default true preserves production behaviour.
  # Set to false for control-plane-only / profiling runs: in-process RIB,
  # ACTIVE selection, redistribute and NHT still run; netlink RouteAdd/Del
  # and startup stale-route purge are skipped. Logs contain "fib-install skipped".
  fib_install = true


# Passive control-plane metrics export (JSONL and/or CSV).
# Default off. When enabled: open switch → run scenario → pull log files only
# (no GetState polling loop). See docs/observability.md.
[observability]
  # Enable or disable
  enabled = false
  # Directory for metric files (writable by @user / @group)
  dir = "/var/log/holo"
  # Basename without extension → {file_prefix}.jsonl / .csv
  file_prefix = "holod-metrics"
  # Sample interval in milliseconds (min 100)
  interval_ms = 1000
  # Format: "jsonl", "csv", or "both"
  format = "both"
  # Best-effort process RSS from /proc/self/status
  include_process = true

# Daemon plugins
[plugins]
  # gRPC northbound plugin configuration
  [plugins.grpc]
    # Enable or disable the plugin
    enabled = true
    # gRPC server listening address
    address = "0.0.0.0:50051"
    # Optional gRPC TLS configuration
    [plugins.grpc.tls]
      # Enable or disable TLS authentication
      enabled = false
      # TLS certificate
      certificate = "/etc/ssl/private/holo.pem"
      # TLS key
      key = "/etc/ssl/certs/holo.key"

  # gNMI northbound plugin configuration
  [plugins.gnmi]
    # Enable or disable the plugin
    enabled = true
    # gNMI server listening address
    address = "0.0.0.0:10161"
    # Optional gNMI TLS configuration
    [plugins.gnmi.tls]
      # Enable or disable TLS authentication
      enabled = false
      # TLS certificate
      certificate = "/etc/ssl/private/holo.pem"
      # TLS key
      key = "/etc/ssl/certs/holo.key"
