# User and group information
user = "holo"
group = "holo"

# Path to the non-volatile memory storage for configuration transactions,
# graceful-restart information, authentication sequence numbers, and more.
#
# Needs to be writable by @user or @group.
database_path = "/var/opt/holo/holo.db"

# Logging configuration
[logging]
  # Logging to journald
  [logging.journald]
    # Enable or disable
    enabled = false

  # Logging to a file
  [logging.file]
    # Enable or disable
    enabled = true
    # File path (needs to be writable by @user or @group)
    dir = "/var/log/"
    # File name
    name = "holod.log"
    # Log rotation (options: "never", "daily", "hourly")
    rotation = "never"
    # Logging style (options: "full", "compact", "pretty", "json")
    style = "full"
    # Enable or disable ANSI terminal colors
    colors = false
    # Sets whether or not the thread ID of the current thread is displayed
    show_thread_id = false
    # Sets whether or not an event’s source code file path and line number are displayed
    show_source = false

  # Logging to the standard output
  [logging.stdout]
    # Enable or disable
    enabled = false
    # Logging style (options: "full", "compact", "pretty", "json")
    style = "full"
    # Enable or disable ANSI terminal colors
    colors = false
    # Sets whether or not the thread ID of the current thread is displayed
    show_thread_id = false
    # Sets whether or not an event’s source code file path and line number are displayed
    show_source = false

# Event recorder (useful for bug reporting)
[event_recorder]
  # Enable or disable the event recorder
  enabled = false
  # Directory where to save the files (needs to be writable by @user or @group)
  dir = "/var/opt/holo"

# Domain metrics for offline analysis (NDJSON — one JSON object per line).
# Turn on, run the experiment, pull the file; no GetState polling required
# for SPF finish / RIB batch events. Schema: holo.metrics.v1
[observability]
  # Default false (zero overhead). true = append machine-parseable events.
  metrics_ndjson_enabled = false
  # Writable by holod user after privilege drop (same constraint as logging.file).
  metrics_ndjson_path = "/var/log/holod-metrics.jsonl"

# Global routing / kernel FIB behaviour (holo-routing).
[routing]
  # Install and uninstall IP/MPLS routes in the kernel FIB via netlink.
  # Default true preserves production behaviour.
  # Set to false for control-plane-only / profiling runs: in-process RIB,
  # ACTIVE selection, redistribute and NHT still run; netlink RouteAdd/Del
  # and startup stale-route purge are skipped. Logs contain "fib-install skipped".
  fib_install = true

# IS-IS process-start SPF defaults (static; not hot-reloaded).
# Priority per field: explicit value here > HOLO_ISIS_SPF_* env > YANG/code default.
# Northbound (gRPC/gNMI/CLI) commits override the running instance afterwards.
# get-config only reflects committed YANG and may disagree with these startup
# defaults until the same values are also committed via northbound.
# Omit a key to leave it unset (env or YANG default applies).
[isis.spf]
  # Master switch for automatic SPF (RFC 8405 delay FSM). Default true.
  enabled = true
  # RFC 8405 delay parameters (milliseconds)
  initial_delay = 50
  short_delay = 200
  long_delay = 5000
  hold_down = 10000
  time_to_learn = 500

# Daemon plugins
[plugins]
  # gRPC northbound plugin configuration
  [plugins.grpc]
    # Enable or disable the plugin
    enabled = true
    # gRPC server listening address
    address = "0.0.0.0:50051"
    # Optional gRPC TLS configuration
    [plugins.grpc.tls]
      # Enable or disable TLS authentication
      enabled = false
      # TLS certificate
      certificate = "/etc/ssl/private/holo.pem"
      # TLS key
      key = "/etc/ssl/certs/holo.key"

  # gNMI northbound plugin configuration
  [plugins.gnmi]
    # Enable or disable the plugin
    enabled = true
    # gNMI server listening address
    address = "0.0.0.0:10161"
    # Optional gNMI TLS configuration
    [plugins.gnmi.tls]
      # Enable or disable TLS authentication
      enabled = false
      # TLS certificate
      certificate = "/etc/ssl/private/holo.pem"
      # TLS key
      key = "/etc/ssl/certs/holo.key"
